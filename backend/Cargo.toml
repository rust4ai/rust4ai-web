[package]
name = "rust4ai"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust4ai"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6", features = ["compression-full", "cors", "trace"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
resend-rs = "0.9"
validator = { version = "0.19", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
futureauth = { version = "0.5", features = ["axum-integration"] }

[build-dependencies]
# No build deps needed — rust-embed handles it at compile time
